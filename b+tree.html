<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>B+Tree Visualization</title>
		<style>
			* {
				font-family: monospace;
				font-size: 16px;
			}

			body {
				margin: 0;
				padding: 0;
			}

			#textWidth {
				position: absolute;
				left: -9999px;
				top: -9999px;
			}

			.controls {
				position: absolute;
				top: 10px;
				left: 10px;
				z-index: 999;
			}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<span id="textWidth"></span>

		<div class="controls">
			<input type="number" name="key" id="keyInput" placeholder="Key" />
			<button id="insertButton">Insert</button><br />
			<input
				type="number"
				name="rangeStart"
				id="rangeStartInput"
				placeholder="Range Start"
			/>
			<input
				type="number"
				name="rangeEnd"
				id="rangeEndInput"
				placeholder="Range End"
			/>
			<button id="rangeSearchButton">Range Search</button>
			<button id="clearSearch">Clear Search</button>
		</div>

		<script src="./b+tree.js"></script>
		<script>
			const tree = new BPlusTree(4)
		</script>
		<script src="visualize.js"></script>
	</body>
</html>
